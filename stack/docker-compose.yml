# GENERATED BY stack/generate-compose.py - do not edit by hand.
# Free-model traffic leaves through the engine's built-in WARP pool.
# No external WARP namespaces, tinyproxy nodes, or dedupe service.

services:
  # Seeds the engine's config into its named volume (bind-mounting that
  # path breaks startup, so it is copied instead).
  config-init:
    image: docker.io/library/busybox:1.36
    environment:
      - WARP_ACCEPT_TOS=${WARP_ACCEPT_TOS:-0}
      - WARP_SOURCE_IPV6=${WARP_SOURCE_IPV6:-}
    command:
      - sh
      - -c
      - |
        if [ "$$WARP_ACCEPT_TOS" != "1" ]; then
          echo 'Cloudflare WARP terms were not accepted.' >&2
          echo 'Read https://www.cloudflare.com/application/terms/ and set WARP_ACCEPT_TOS=1 in stack/.env.' >&2
          exit 1
        fi
        if [ -n "$$WARP_SOURCE_IPV6" ]; then
          sed "s|\"source_ipv6\": \"\"|\"source_ipv6\": \"$$WARP_SOURCE_IPV6\"|" /seed.json > /tmp/config.json
        else
          cp /seed.json /tmp/config.json
        fi
        install -o 1000 -g 1000 -m 0644 /tmp/config.json /vol/config.json
    volumes:
      - ./config.json:/seed.json:ro
      - ofu-engine:/vol
    restart: "no"

  opencode-engine:
    image: ghcr.io/jasonxu114514/opencode2api:v1.4.5
    container_name: ofu-engine
    network_mode: host   # built-in WARP needs outbound UDP and source-address binding
    volumes:
      - ofu-engine:/var/lib/opencode2api
    restart: unless-stopped
    depends_on:
      config-init:
        condition: service_completed_successfully

volumes:
  ofu-engine:
