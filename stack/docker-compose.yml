# GENERATED BY stack/generate-compose.py - do not edit by hand.
# Each node = one WARP network namespace + one CONNECT proxy on its own port.

x-warp: &warp
  build:
    context: ./warp
    dockerfile: Dockerfile
  image: ofu-warp-rotator:local
  privileged: true
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  restart: unless-stopped

x-tinyproxy: &tinyproxy
  build:
    context: ./tinyproxy
  image: ofu-tinyproxy:local
  restart: unless-stopped

services:
  # Seeds the engine's config into its named volume (bind-mounting that
  # path breaks startup, so it is copied instead).
  config-init:
    image: busybox:1.36
    command: ["sh", "-c", "install -o 1000 -g 1000 -m 0644 /seed.json /vol/config.json"]
    volumes:
      - ./config.json:/seed.json:ro
      - ofu-engine:/vol
    restart: "no"

  alztrk-warp-a:
    <<: *warp
    container_name: ofu-warp-a
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=120
    ports:
      - "18090:8888"
    volumes:
      - ofu-warp-a:/app/data

  tinyproxy-a:
    <<: *tinyproxy
    container_name: ofu-proxy-a
    network_mode: service:alztrk-warp-a
    depends_on:
      - alztrk-warp-a

  alztrk-warp-b:
    <<: *warp
    container_name: ofu-warp-b
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=145
    ports:
      - "18091:8888"
    volumes:
      - ofu-warp-b:/app/data

  tinyproxy-b:
    <<: *tinyproxy
    container_name: ofu-proxy-b
    network_mode: service:alztrk-warp-b
    depends_on:
      - alztrk-warp-b

  alztrk-warp-c:
    <<: *warp
    container_name: ofu-warp-c
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=170
    ports:
      - "18092:8888"
    volumes:
      - ofu-warp-c:/app/data

  tinyproxy-c:
    <<: *tinyproxy
    container_name: ofu-proxy-c
    network_mode: service:alztrk-warp-c
    depends_on:
      - alztrk-warp-c

  alztrk-warp-d:
    <<: *warp
    container_name: ofu-warp-d
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=195
    ports:
      - "18093:8888"
    volumes:
      - ofu-warp-d:/app/data

  tinyproxy-d:
    <<: *tinyproxy
    container_name: ofu-proxy-d
    network_mode: service:alztrk-warp-d
    depends_on:
      - alztrk-warp-d

  alztrk-warp-e:
    <<: *warp
    container_name: ofu-warp-e
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=220
    ports:
      - "18094:8888"
    volumes:
      - ofu-warp-e:/app/data

  tinyproxy-e:
    <<: *tinyproxy
    container_name: ofu-proxy-e
    network_mode: service:alztrk-warp-e
    depends_on:
      - alztrk-warp-e

  alztrk-warp-f:
    <<: *warp
    container_name: ofu-warp-f
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=245
    ports:
      - "18095:8888"
    volumes:
      - ofu-warp-f:/app/data

  tinyproxy-f:
    <<: *tinyproxy
    container_name: ofu-proxy-f
    network_mode: service:alztrk-warp-f
    depends_on:
      - alztrk-warp-f

  opencode-engine:
    image: ghcr.io/jasonxu114514/opencode2api:latest
    container_name: ofu-engine
    network_mode: host   # so 127.0.0.1:<proxy port> resolves the pool
    volumes:
      - ofu-engine:/var/lib/opencode2api
    restart: unless-stopped
    depends_on:
      config-init:
        condition: service_completed_successfully

volumes:
  ofu-engine:
  ofu-warp-a:
  ofu-warp-b:
  ofu-warp-c:
  ofu-warp-d:
  ofu-warp-e:
  ofu-warp-f:
