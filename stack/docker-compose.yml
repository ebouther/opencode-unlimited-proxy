services:
  alztrk-warp-a:
    image: opencode-ip-rotator-warp-rotator:latest
    container_name: ofu-warp-a
    ports:
      - "18090:8888"
      - "18180:8000"
    privileged: true
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - WARP_ROTATION_INTERVAL=120
      - CORS_ALLOW_ORIGINS=*
    volumes:
      - ofu-warp-a:/app/data
    restart: unless-stopped

  tinyproxy-a:
    image: alpine:latest
    command: ["/bin/sh","-c","apk add --no-cache tinyproxy >/dev/null && printf 'Port 8888\nAllow 127.0.0.1\nAllow 192.168.0.0/16\nAllow 10.0.0.0/8\nAllow 172.16.0.0/12\nConnectPort 443\nConnectPort 80\n' >/etc/tinyproxy/tinyproxy.conf && tinyproxy -d"]
    container_name: ofu-proxy-a
    network_mode: service:alztrk-warp-a
    restart: unless-stopped
    depends_on:
      - alztrk-warp-a

  alztrk-warp-b:
    image: opencode-ip-rotator-warp-rotator:latest
    container_name: ofu-warp-b
    ports:
      - "18091:8888"
      - "18181:8000"
    privileged: true
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - WARP_ROTATION_INTERVAL=180
      - CORS_ALLOW_ORIGINS=*
    volumes:
      - ofu-warp-b:/app/data
    restart: unless-stopped

  tinyproxy-b:
    image: alpine:latest
    command: ["/bin/sh","-c","apk add --no-cache tinyproxy >/dev/null && printf 'Port 8888\nAllow 127.0.0.1\nAllow 192.168.0.0/16\nAllow 10.0.0.0/8\nAllow 172.16.0.0/12\nConnectPort 443\nConnectPort 80\n' >/etc/tinyproxy/tinyproxy.conf && tinyproxy -d"]
    container_name: ofu-proxy-b
    network_mode: service:alztrk-warp-b
    restart: unless-stopped
    depends_on:
      - alztrk-warp-b

  config-init:
    image: busybox:latest
    command: ["sh","-c","install -o 1000 -g 1000 -m 644 /seed.json /vol/config.json"]
    volumes:
      - ./config.json:/seed.json:ro
      - ofu-engine:/vol
    restart: "no"

  opencode-engine:
    image: ghcr.io/jasonxu114514/opencode2api:latest
    container_name: ofu-engine-nodes
    network_mode: host
    volumes:
      - ofu-engine:/var/lib/opencode2api
    restart: unless-stopped
    depends_on:
      config-init:
        condition: service_completed_successfully

volumes:
  ofu-warp-a:
  ofu-warp-b:
  ofu-engine:
