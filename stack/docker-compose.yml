# GENERATED BY stack/generate-compose.py - do not edit by hand.
# Each node = one WARP network namespace + one CONNECT proxy on its own port.

x-warp: &warp
  build:
    context: ./warp
    dockerfile: Dockerfile
  image: ofu-warp-rotator:local
  pull_policy: never
  privileged: true
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 90s

x-tinyproxy: &tinyproxy
  build:
    context: ./tinyproxy
  image: ofu-tinyproxy:local
  pull_policy: never
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 8888 || exit 1"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  # Seeds the engine's config into its named volume (bind-mounting that
  # path breaks startup, so it is copied instead).
  config-init:
    image: busybox:1.36
    command: ["sh", "-c", "install -o 1000 -g 1000 -m 0644 /seed.json /vol/config.json"]
    volumes:
      - ./config.json:/seed.json:ro
      - ofu-engine:/vol
    restart: "no"

  alztrk-warp-a:
    <<: *warp
    container_name: ofu-warp-a
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=86400
      - WARP_ACCEPT_TOS=${WARP_ACCEPT_TOS:-0}
    ports:
      - "18090:8888"
    volumes:
      - ofu-warp-a:/app/data

  tinyproxy-a:
    <<: *tinyproxy
    container_name: ofu-proxy-a
    network_mode: service:alztrk-warp-a
    depends_on:
      alztrk-warp-a:
        condition: service_healthy
    environment:
      # Names this node's drain marker, /markers/<NODE_ID>.
      - NODE_ID=a
    volumes:
      - ofu-dedupe:/markers

  alztrk-warp-b:
    <<: *warp
    container_name: ofu-warp-b
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=86425
      - WARP_ACCEPT_TOS=${WARP_ACCEPT_TOS:-0}
    ports:
      - "18091:8888"
    volumes:
      - ofu-warp-b:/app/data

  tinyproxy-b:
    <<: *tinyproxy
    container_name: ofu-proxy-b
    network_mode: service:alztrk-warp-b
    depends_on:
      alztrk-warp-b:
        condition: service_healthy
    environment:
      # Names this node's drain marker, /markers/<NODE_ID>.
      - NODE_ID=b
    volumes:
      - ofu-dedupe:/markers

  alztrk-warp-c:
    <<: *warp
    container_name: ofu-warp-c
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=86450
      - WARP_ACCEPT_TOS=${WARP_ACCEPT_TOS:-0}
    ports:
      - "18092:8888"
    volumes:
      - ofu-warp-c:/app/data

  tinyproxy-c:
    <<: *tinyproxy
    container_name: ofu-proxy-c
    network_mode: service:alztrk-warp-c
    depends_on:
      alztrk-warp-c:
        condition: service_healthy
    environment:
      # Names this node's drain marker, /markers/<NODE_ID>.
      - NODE_ID=c
    volumes:
      - ofu-dedupe:/markers

  # Keeps egress addresses distinct across the pool. WARP draws from a
  # small per-region pool, so nodes collide by default; this one polls
  # every node, re-rolls the collisions, and drains nodes that cannot be
  # given their own address. Best effort: if it dies, the pool still runs.
  ofu-dedupe:
    build:
      context: ./dedupe
    image: ofu-dedupe:local
    pull_policy: never
    container_name: ofu-dedupe
    command:
      - "--interval=${DEDUPE_INTERVAL:-30}"
    environment:
      - POOL_NODES=alztrk-warp-a,alztrk-warp-b,alztrk-warp-c
    volumes:
      - ofu-dedupe:/markers
    restart: unless-stopped
    depends_on:
      alztrk-warp-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  opencode-engine:
    image: ghcr.io/jasonxu114514/opencode2api:v1.4.1
    container_name: ofu-engine
    network_mode: host   # so 127.0.0.1:<proxy port> resolves the pool
    volumes:
      - ofu-engine:/var/lib/opencode2api
    restart: unless-stopped
    depends_on:
      config-init:
        condition: service_completed_successfully

volumes:
  ofu-engine:
  ofu-dedupe:      # per-node drain markers, shared with the proxies
  ofu-warp-a:
  ofu-warp-b:
  ofu-warp-c:
