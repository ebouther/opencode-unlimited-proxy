# Docker Compose configuration for Bridge Network Mode.
# Use this when running on macOS, Windows (Docker Desktop), Kubernetes,
# or when host networking is restricted or not desired.
#
# Free models can route through custom proxies configured in config.json
# or an external proxy pool. Published ports bind to host 127.0.0.1 to maintain
# local loopback security.
#
# Usage:
#   docker compose -f docker-compose.bridge.yml up -d

services:
  config-init:
    image: docker.io/library/busybox:1.36
    security_opt:
      - label:disable
    environment:
      - OPENCODE2API_SERVER_KEYS=${OPENCODE2API_SERVER_KEYS:-}
      - WEBUI_USERNAME=${WEBUI_USERNAME:-}
      - WEBUI_PASSWORD=${WEBUI_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        cp /seed.json /tmp/config.json
        # In bridge mode, bind inside the container to 0.0.0.0 so Docker port mapping reaches it
        sed -i 's/"127.0.0.1:8080"/"0.0.0.0:8080"/' /tmp/config.json
        sed -i 's/"127.0.0.1:8081"/"0.0.0.0:8081"/' /tmp/config.json
        # Disable engine-managed WARP (since WARP source-binding requires host namespace)
        sed -i 's/"enabled": true/"enabled": false/' /tmp/config.json
        if [ -n "$$OPENCODE2API_SERVER_KEYS" ]; then
          sed -i "s|\"local-test-key\"|\"$$OPENCODE2API_SERVER_KEYS\"|g" /tmp/config.json
        fi
        if [ -n "$$WEBUI_USERNAME" ]; then
          sed -i "s|\"username\": \"admin\"|\"username\": \"$$WEBUI_USERNAME\"|" /tmp/config.json
        fi
        if [ -n "$$WEBUI_PASSWORD" ]; then
          sed -i "s|\"password\": \"changeme-changeme\"|\"password\": \"$$WEBUI_PASSWORD\"|" /tmp/config.json
        fi
        install -o 1000 -g 1000 -m 0644 /tmp/config.json /vol/config.json
    volumes:
      - ./config.json:/seed.json:ro
      - ofu-engine-bridge:/vol
    restart: "no"

  opencode-engine:
    image: ghcr.io/jasonxu114514/opencode2api:v1.4.5
    container_name: ofu-engine-bridge
    ports:
      # Host loopback only: preserves zero-exposure posture
      - "127.0.0.1:${LISTEN_PORT:-8080}:8080"
      - "127.0.0.1:${WEBUI_PORT:-8081}:8081"
    volumes:
      - ofu-engine-bridge:/var/lib/opencode2api
    restart: unless-stopped
    depends_on:
      config-init:
        condition: service_completed_successfully

volumes:
  ofu-engine-bridge:
