## tinyproxy configuration for opencode-free-unlimited
##
## One tinyproxy instance shares the network namespace of its WARP rotator
## container, so everything it forwards exits through that rotator's tunnel.
## The engine (opencode2api) reaches it on the host via the published port.

Port 8888

# The engine reaches this proxy from the Docker bridge, not from 127.0.0.1.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# HTTPS (CONNECT) is what opencode2api uses for the inference endpoint.
ConnectPort 443
ConnectPort 80

Timeout 60
MaxClients 64
