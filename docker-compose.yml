services:
  proxy-server:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: opencode_proxy_server
    # Shares the WARP network namespace. This makes the proxy's own outbound
    # requests use the same egress path that the rotator verifies.
    network_mode: "service:warp-rotator"
    depends_on:
      warp-rotator:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./proxies.txt:/app/data/proxies.txt:ro
    restart: unless-stopped
    environment:
      - OPENCODE_ZEN_PORT=8000
      - OPENCODE_ZEN_HOST=0.0.0.0
      - OPENCODE_ZEN_TARGET_BASE=https://opencode.ai/zen/v1
      - PROXY_LIST_FILE=/app/data/proxies.txt
      - PROXY_LIST=${PROXY_LIST:-}
      - WARP_ROTATOR_URL=http://127.0.0.1:8001
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      - LOG_LEVEL=DEBUG
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  warp-rotator:
    build:
      context: .
      dockerfile: Dockerfile.warp
    container_name: opencode_warp_rotator
    ports:
      - "8000:8000"
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    environment:
      - WARP_CHECK_ENDPOINT=https://opencode.ai
      - WARP_CHECK_INTERVAL=15
      - WARP_ROTATION_INTERVAL=300
      - METRICS_DB_PATH=/app/data/metrics.db
      - PROXY_LIST_FILE=/app/data/proxies.txt
      - PROXY_LIST=${PROXY_LIST:-}
    volumes:
      - ./data:/app/data
      - ./proxies.txt:/app/data/proxies.txt:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
